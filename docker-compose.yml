services:
    antifier:
        privileged: true
        tty: true
        build:
            context: ./
            dockerfile: ./Dockerfile
        working_dir: /antifier
        command: bash -c "python3 antifier.py -l -c power_calc_factors_fortius.txt -s"
        volumes:
            - ./:/antifier
#            - /dev/serial/by-id/usb-Dynastream_Innovations_ANT_USB-m_Stick_106-if00-port0:/dev/ttyUSB0
        devices:
            - /dev/serial/by-id/usb-Dynastream_Innovations_ANT_USB-m_Stick_106-if00-port0:/dev/ttyUSB0
